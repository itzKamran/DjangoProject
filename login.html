{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card login-card">
            <div class="auth-header">
                <div class="auth-icon">Nazdeekly</div>
                <h2>Login Account</h2>
                <p>Welcome back! Please enter your details.</p>
            </div>

            <form method="post" action="{% url 'login-user' %}">
                {% csrf_token %}

                {% if message %}
                <div class="alert alert-info" role="alert">
                    {{ message }}
                </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="uname" placeholder="Enter your username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter Password" name="passwd" required>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">Log In</button>
                </div>

                <p class="auth-link">
                    New user?
                    <a href="{% url 'create-page' %}">Register</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
