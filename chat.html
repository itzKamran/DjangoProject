{% load static %}
<!DOCTYPE html>
<html>

<head>

    <title>Chat</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.3">

</head>

<body>

<div class="chat-container">

    <div class="chat-header">

        <h2>

            Chat -
            {{ application.job.job_title }}

        </h2>

    </div>

    <div id="chat-box">

        {% for msg in messages %}

            <div class="{% if msg.sender == user %}my-message{% else %}other-message{% endif %}">

                <b>

                    {{ msg.sender.full_name|default:msg.sender.username }}

                </b>

                <br>

                {{ msg.message }}

                {% if msg.attachment %}

                <br><br>

                <a href="{{ msg.attachment.url }}" target="_blank">

                    Download Attachment

                </a>

                {% endif %}

                <br>

                <small>

                    {{ msg.timestamp }}

                </small>

            </div>

        {% endfor %}

    </div>

    <form

        method="POST"

        enctype="multipart/form-data"

    >

        {% csrf_token %}

        <textarea

            name="message"

            placeholder="Type message..."

        ></textarea>

        <br>

        <input

            type="file"

            name="attachment"

        >

        <br>

        <button>

            Send

        </button>

    </form>

</div>

<script>

function loadMessages(){

fetch("{% url 'fetch-messages-api' application.id %}")

.then(response=>response.json())

.then(data=>{

let box=document.getElementById("chat-box");

box.innerHTML="";

data.messages.forEach(function(msg){

let div=document.createElement("div");

div.className=msg.is_self?"my-message":"other-message";

let html="<b>"+msg.sender+"</b><br>";

html+=msg.message;

if(msg.attachment!=""){

html+="<br><a href='"+msg.attachment+"' target='_blank'>Attachment</a>";

}

html+="<br><small>"+msg.time+"</small>";

div.innerHTML=html;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});

}

setInterval(loadMessages,2000);

</script>

</body>

</html>
