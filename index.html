{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}"?v=1.2>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">Nazdeekly</div>
                <h2>Create Account</h2>
                <p>Join the job portal and start your journey today.</p>
            </div>

            <form method="post" action="{% url 'create-user' %}">
                {% csrf_token %}

                {% if message %}
                <div class="alert alert-info" role="alert">
                    {{ message }}
                </div>
                {% endif %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Full Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Enter your full name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter your email">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Mobile Number</label>
                        <input type="text" class="form-control" name="mobile_no" placeholder="Enter mobile number">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Username</label>
                        <input type="text" class="form-control" name="uname" placeholder="Choose a username">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Create Password" name="passwd">
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm Password" name="confirm_passwd">
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" name="role">
                        <option selected>Select Role</option>
                        <option>Job Seeker</option>
                        <option>Employer</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary btn-lg" type="submit">Register</button>
                </div>

                <p class="auth-link">
                    Already have an account?
                    <a href="{% url 'login-page' %}">Login</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
