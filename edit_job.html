{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job | Nazdeekly</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}"?v=1.2>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        Nazdeekly
    </div>

    <div class="profile">

        <button class="profile-btn">

            <div class="avatar">
                {{ user.full_name|default:user.username|slice:":1"|upper }}
            </div>

            <span>{{ user.full_name|default:user.username }}</span>

        </button>

    </div>

</nav>

<!-- ================= PAGE ================= -->

<div class="container">

    <div class="page-title">

        <h1><i class="fa-solid fa-pen-to-square"></i> Edit Job Post</h1>

        <p>Update the details for {{ job.job_title }}.</p>

    </div>

    <div class="job-form-card">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="form-group">

                    <label>Job Title</label>

                    <input type="text"
                           name="job_title"
                           value="{{ job.job_title }}"
                           required>

                </div>

                <div class="form-group">

                    <label>Company Name</label>

                    <input type="text"
                           name="company_name"
                           value="{{ job.company_name }}"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="form-group">

                    <label>Location</label>

                    <input type="text"
                           name="location"
                           value="{{ job.location }}"
                           required>

                </div>

                <div class="form-group">

                    <label>Salary</label>

                    <input type="number"
                           name="salary"
                           value="{{ job.salary }}"
                           required>

                </div>

            </div>

            <div class="row">

                <div class="form-group">

                    <label>Job Type</label>

                    <select name="job_type">

                        <option value="Full Time" {% if job.job_type == "Full Time" %}selected{% endif %}>Full Time</option>

                        <option value="Part Time" {% if job.job_type == "Part Time" %}selected{% endif %}>Part Time</option>

                        <option value="Internship" {% if job.job_type == "Internship" %}selected{% endif %}>Internship</option>

                        <option value="Remote" {% if job.job_type == "Remote" %}selected{% endif %}>Remote</option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label>Job Description</label>

                <textarea
                    name="description"
                    rows="6"
                    required>{{ job.description }}</textarea>

            </div>

            <div class="button-group">

                <button type="submit" class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Job

                </button>

                <a href="{% url 'my_jobs' %}" class="cancel-btn">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
